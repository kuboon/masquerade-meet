name = "masquerade-meet"
# https://developers.cloudflare.com/workers/platform/compatibility-dates
compatibility_date = "2024-10-07"
main = "./build/index.js"
compatibility_flags = ["nodejs_compat"]

# Everything in public/ is served before the Worker runs, so `server.ts` only
# ever sees requests that match no file. Replaces Workers Sites, which is
# deprecated, kept assets in a KV namespace the Worker had to read itself, and
# is the one thing `wrangler versions upload` refuses to work with.
[assets]
  directory = "./public"

# CALLS_APP_ID and CALLS_APP_SECRET are deliberately NOT declared here.
# Both come from your Cloudflare Realtime application, both are per-account,
# and a placeholder in [vars] would silently overwrite the real value on every
# `wrangler deploy`. Put them in .dev.vars and run `npm run deploy:secrets`.

# Optional vars
# [vars]
# OPENAI_MODEL_ENDPOINT = ""

[[durable_objects.bindings]]
name = "rooms"
class_name = "ChatRoom"

# Indicate that you want the ChatRoom class to be callable as Durable Objects.
# `new_sqlite_classes` rather than `new_classes`: SQLite-backed Durable Objects
# are the only kind the free plan will create, and they are what Cloudflare
# recommends for new namespaces regardless of plan. ChatRoom only ever touches
# the key-value storage API (`get`/`put`/`delete`/alarms), which both backends
# support identically, so nothing in the room logic depends on the choice.
[[migrations]]
tag = "v1" # Should be unique for each entry
new_sqlite_classes = ["ChatRoom"]

# Required secrets (see .dev.vars.example):
# - CALLS_APP_ID
# - CALLS_APP_SECRET
# Run `npm run deploy:secrets` to upload everything in .dev.vars at once, or
# set them one at a time with `wrangler secret put <NAME>`.

# Optional secrets:
# - OPENAI_API_TOKEN

# The Worker every pull request is deployed to, as `masquerade-meet-preview`.
#
# A whole Worker of its own rather than a preview version of the production
# one. `wrangler versions upload` would do the latter and is available now
# that assets have moved off Workers Sites, but a version shares its
# bindings with production — including the Durable Object namespace, so a
# room opened in a preview could be walked into from production by guessing
# its name. A separate Worker gets a namespace of its own.
#
# One shared Worker rather than one per pull request: whichever branch was
# pushed last is what is standing there, which suits a project with one branch
# in flight and leaves nothing to clean up afterwards.
#
# Bindings are not inherited by environments, so the Durable Object has to be
# named again here. `main`, `site` and the compatibility settings are.
[env.preview]

[[env.preview.durable_objects.bindings]]
name = "rooms"
class_name = "ChatRoom"
