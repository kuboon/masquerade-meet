name: Sync Worker secrets

# Worker secrets survive deploys, so there is no reason to push them on every
# run — that would only mint a new Worker version each time. Run this by hand
# after the first deploy, or whenever you rotate the Realtime credentials.
on:
  workflow_dispatch:

jobs:
  sync:
    name: Upload Realtime credentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `wrangler secret bulk` reads JSON from stdin, so the values never touch
      # the disk. cloudflare/wrangler-action would also do this, but its
      # `secrets` input runs a deploy in the same step, which is not what we
      # want here — and this way CI uses the wrangler pinned in package.json.
      # Both Workers: secrets are per-Worker, and the preview one cannot open
      # a Realtime session without them — which would leave the one button
      # anybody wants to try in a preview greyed out. Piped twice rather than
      # written to a file once, so the values still never touch the disk.
      - name: Upload secrets
        run: |
          credentials() {
            jq -n \
              --arg app_id "$CALLS_APP_ID" \
              --arg app_secret "$CALLS_APP_SECRET" \
              '{CALLS_APP_ID: $app_id, CALLS_APP_SECRET: $app_secret}'
          }
          credentials | npx wrangler secret bulk
          credentials | npx wrangler secret bulk -e preview
        env:
          CALLS_APP_ID: ${{ secrets.CALLS_APP_ID }}
          CALLS_APP_SECRET: ${{ secrets.CALLS_APP_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ac92f36f0a2d84353b137574157f7480
          WRANGLER_SEND_METRICS: 'false'
