name: CI

# Branch pushes are covered by the pull_request trigger. Listening to both
# would run every job twice on any branch that has a PR open.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  e2e:
    name: Browser tests (real browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # Everything except joining-room.spec.ts, which drives a real meeting
      # and needs Cloudflare Realtime credentials we do not want in CI. The
      # DSP spec is self-contained in an OfflineAudioContext, the tuner spec
      # gets by on Chromium's fake capture device, and host succession and
      # rejoining are settled in the lobby, before any of that is needed.
      # The seating spec talks the room's own WebSocket protocol rather than
      # driving the lobby, which is how it reaches a running meeting without
      # Realtime credentials.
      - run: >
          npx playwright test
          voice-changer dev-voice entry still-image host-succession rejoining
          seating settings lobby character-lock roles assets
        env:
          # serve the built worker instead of the Remix watch-mode dev server
          PLAYWRIGHT_WEB_SERVER_COMMAND: npm start
          WRANGLER_SEND_METRICS: 'false'
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  preview:
    name: Preview on Cloudflare
    # Same gate as `deploy`, and for the same reason: a flaky browser launch
    # should not be able to hold up a preview.
    needs: check
    # Only for pull requests raised from this repository. A fork's job cannot
    # see the API token, and failing for want of a secret nobody can give it
    # would be noise on every outside contribution.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To leave the preview link on the pull request.
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A deploy to the preview Worker rather than `wrangler versions upload`
      # against the production one. Both work now that assets have moved off
      # Workers Sites; a separate Worker is kept because it gets a separate
      # Durable Object namespace with it, so a room opened in a preview
      # cannot be walked into from production by guessing its name. See the
      # [env.preview] block in wrangler.toml.
      - id: upload
        run: |
          set -o pipefail
          npm run deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1 || true)
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          WRANGLER_ARGS: -e preview
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Not a secret: an account ID identifies the target account but
          # grants nothing on its own. The API token is what needs guarding.
          CLOUDFLARE_ACCOUNT_ID: ac92f36f0a2d84353b137574157f7480
          WRANGLER_SEND_METRICS: 'false'
      - if: steps.upload.outputs.url != ''
        uses: actions/github-script@v8
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
        with:
          script: |
            // Edited in place rather than added to, so a long-running pull
            // request does not collect one of these per push.
            const marker = '<!-- cloudflare-preview -->'
            const body = [
              marker,
              `**プレビュー**: ${process.env.PREVIEW_URL}`,
              '',
              'このブランチの最新コミットです。本番とは別の Worker なので、',
              'ここで開いたルームは本番からは見えません。',
              'プレビュー用 Worker は1つきりで、最後に push された PR のものが',
              '立っています。',
            ].join('\n')
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number }
            )
            const existing = comments.find(
              (c) => c.user?.login === 'github-actions[bot]' && c.body?.includes(marker)
            )
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              })
            }

  deploy:
    name: Deploy to Cloudflare
    # Deliberately gated on `check` only. A flaky browser launch should not be
    # able to block a deploy; correctness of the app is what `check` covers.
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Runs the same `npm run deploy` you would run locally, using the
      # wrangler version pinned in package.json rather than whatever a
      # third-party action would install. Wrangler picks the credentials up
      # from the environment.
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Not a secret: an account ID identifies the target account but
          # grants nothing on its own. The API token is what needs guarding.
          CLOUDFLARE_ACCOUNT_ID: ac92f36f0a2d84353b137574157f7480
          WRANGLER_SEND_METRICS: 'false'
